schema_version: 1
character: jun
# Curated combo routes for the route gates (midscreen, wall, heat, counter_hit).
# tools/export_full_combat_bindings.py resolves commands to stable ids and
# writes data/generated/full_combat_routes.csv; the full-combat engine then
# executes each route and asserts that every input is legal when issued and
# that every hit after the starter lands before the opponent can act.
#
# A route passing in the engine is a simulator result only. The gate itself
# (data/validation/jun.json "routes") passes only after the route is confirmed
# in Practice mode.
#
# source: guide = written in the evidence below; derived = assembled from
# guide pieces or move data and still to confirm.
evidence:
  - https://tekkendocs.com/jun/guide (Season 2 guide, combo section, retrieved 2026-09-23)
routes:
  - name: df2_beginner
    category: midscreen
    source: guide           # "DF2: 4 > 1,1 > IZU 1,1 T! > (F1) IZU 1,1"
    setup: {distance: 0.8, opponent: walk}
    steps:
      - df+2
      - "4"
      - "1,1"
      - IZU.1,1
      - f+1
      - IZU.1,1
    expect: {hits: 9}
  - name: df2_wall_tornado
    category: wall
    source: derived         # df+2 starter with the guide's wall route "D1+2 T! > UF4,3 MIA 2"
    setup: {distance: 0.8, near_wall: true, opponent: crouch}   # stays at the wall; the mid launcher still hits
    steps:
      - df+2
      - d+1+2
      - uf+4,3
      - MIA.2
    expect: {hits: 6}
  - name: ch_u2_izu41
    category: counter_hit
    source: guide           # "CH U2: follow-up IZU 4,1" (u+2 is +20 on counter-hit; IZU.4,1 is i19)
    setup: {distance: 0.8, opponent: attack, opponent_move: df+3+4}   # a plain i24 mid, still in startup
    steps:
      - u+2
      - IZU.4,1
    expect: {hits: 3, counter_hit_starter: true}
  - name: ch_u2_izu3_heat_dash
    category: heat
    source: derived         # guide "CH U2: IZU 3 for HE"; the juggle after Heat Dash is derived
    setup: {distance: 0.8, opponent: attack, opponent_move: df+3+4}
    steps:
      - u+2
      - IZU.3
      - "@HeatDash"
      - "4"
      - "1,1"
    expect: {hits: 6, counter_hit_starter: true, heat_activated: true}
