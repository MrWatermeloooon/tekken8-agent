project:
  mode: offline_local
  character: Jun Kazama
  training_backend: simulator
  validation_backends:
    - diambra
    - tekken8_cv

simulator:
  character: Jun Kazama
  max_health: 180.0
  stage_half_width: 3.6
  decision_frames: 4
  max_frames: 3600
  walk_speed: 0.025
  body_radius: 0.22

environment:
  tick_hz: 15
  max_round_seconds: 60
  action_repeat: 3

state_backend:
  kind: cv
  memory:
    process_name: Tekken8.exe
    offsets_file: config/offsets.example.yaml
  cv:
    monitor_index: 0
    health_bar_regions:
      p1: null
      p2: null

input_backend:
  kind: mock
  vgamepad:
    controller: x360

reward:
  damage_dealt: 1.0
  damage_taken: -1.0
  round_win: 50.0
  round_loss: -50.0
  idle_penalty: -0.01

self_play:
  checkpoint_dir: checkpoints
  max_recent_opponents: 10
  old_opponent_sample_rate: 0.15

diambra:
  game_id: tektagt
  characters:
    - Jun
    - Jin
  roms_path: null
  render_mode: human
  seed: 42
