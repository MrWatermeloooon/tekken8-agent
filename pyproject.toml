[project]
name = "tekken8-agent"
version = "0.1.0"
description = "Offline local Tekken 8 self-play agent scaffold."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cv = [
    "dxcam>=0.0.5",
    "opencv-python>=4.9",
]
diambra = [
    "diambra>=0.0.20",
    "diambra-arena>=2.2",
]
gamepad = [
    "vgamepad>=0.1.0",
]
rl = [
    "stable-baselines3>=2.3",
    "torch>=2.2",
]
memory = [
    "pymem>=1.13",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
